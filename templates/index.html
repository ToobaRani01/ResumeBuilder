<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Resume Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #1f2937;
            padding: 20px 0;
        }

        .container {
            width: min(1200px, 95%);
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 2rem;
        }

        .upload-row {
            margin: 2rem 0 3rem;
        }

        .upload-card {
            border: 2px dashed #cbd5e1;
            padding: 2.5rem;
            border-radius: 15px;
            text-align: center;
            background: #f8fafc;
            transition: all 0.3s ease;
        }

        .upload-card:hover {
            border-color: #667eea;
            background: #ede9fe;
        }

        .upload-card p {
            font-size: 1.1rem;
            color: #4b5563;
            margin-bottom: 1rem;
        }

        input[type=file] {
            display: block;
            margin: 1rem auto 0;
            padding: 0.75rem;
        }

        button {
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-top: 1rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Results Panel */
        .result-panel {
            margin-top: 3rem;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .result-card {
            background: white;
        }

        .hidden {
            display: none;
        }

        .status {
            font-size: 1rem;
            color: #667eea;
            font-weight: 600;
            margin: 1rem 0 2rem;
        }

        /* Score Section */
        .score-section {
            text-align: center;
            padding: 2rem 0;
            background: transparent;
            border-radius: 0;
            color: #1f2937;
            margin-bottom: 2rem;
            box-shadow: none;
        }

        .score-label {
            font-size: 0.95rem;
            font-weight: 500;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #667eea;
        }

        .score-value {
            font-size: 3rem;
            font-weight: 900;
            margin: 0.75rem 0;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-emoji {
            font-size: 2.5rem;
            margin: 0.75rem 0;
        }

        /* Score Range Slider */
        .score-slider-container {
            margin: 2rem auto;
            padding: 0 2rem;
            max-width: 600px;
        }

        .score-range-bar {
            position: relative;
            width: 100%;
            height: 10px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .score-range-fill {
            height: 100%;
            background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 30%, #10b981 70%, #059669 100%);
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            position: relative;
        }

        .score-range-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: -3px;
            width: 16px;
            height: 16px;
            background: white;
            border: 3px solid #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
        }

        .score-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            opacity: 0.7;
            color: #667eea;
            font-weight: 600;
        }

        /* Section Styles */
        .section {
            margin-bottom: 3rem;
            padding: 0 0 2rem 0;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .section-icon {
            font-size: 2rem;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1f2937;
            margin: 0;
        }

        .section-subtitle {
            font-size: 0.95rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }

        /* Gap Checklist */
        .checklist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .checklist-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1.5rem;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            text-align: center;
            transition: all 0.3s ease;
        }

        .checklist-item.has {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            border-color: #10b981;
        }

        .checklist-item.missing {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            border-color: #ef4444;
        }

        .checklist-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .checklist-icon {
            font-size: 2rem;
        }

        .checklist-label {
            font-weight: 600;
            color: #1f2937;
            text-transform: capitalize;
            font-size: 1rem;
        }

        /* Technical Skills */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .skill-tag {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            color: #1e40af;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            border: 2px solid #93c5fd;
            transition: all 0.3s ease;
        }

        .skill-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.2);
            background: linear-gradient(135deg, #bfdbfe 0%, #93c5fd 100%);
        }

        /* Improvements */
        .improvements-list {
            list-style: none;
            margin-top: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }

        .improvement-item {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-left: 5px solid #f59e0b;
            padding: 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.5;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.1);
        }

        .improvement-item:hover {
            transform: translateX(3px);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2);
        }

        .improvement-item strong {
            color: #92400e;
            display: block;
            margin-bottom: 0.5rem;
        }

        /* Error Message */
        #errorText {
            display: none !important;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
            margin: 1rem 0;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 10%; }
            50% { width: 70%; }
            100% { width: 90%; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .card {
                padding: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .score-value {
                font-size: 3rem;
            }

            .checklist-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }

            .section-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>AI Resume Analyzer</h1>
            <p class="subtitle">Upload a PDF resume and receive an ATS-style analysis powered by Gemini LLM.</p>

            <div class="upload-row">
                <div class="upload-card">
                    <p>Drop your resume here or select a PDF to analyze.</p>
                    <input id="resumeFile" type="file" accept="application/pdf" />
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar"></div>
                    </div>
                    <button id="analyzeBtn">Analyze Resume</button>
                </div>
            </div>

            <div class="result-panel hidden" id="resultPanel">
                <div class="result-card">
                    <h2>Analysis Result</h2>
                    <p class="status" id="statusText">Processing complete.</p>
                    
                    <!-- Resume Score -->
                    <div class="score-section" id="scoreSection"></div>
                    
                    <!-- Gap Checklist -->
                    <div id="gapSection"></div>
                    
                    <!-- Technical Skills -->
                    <div id="skillsSection"></div>
                    
                    <!-- Improvements -->
                    <div id="improvementsSection"></div>
                </div>
            </div>

            <p class="status" id="errorText" style="color:#b91c1c;"></p>
        </div>
    </div>

    <script>
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resumeFile = document.getElementById('resumeFile');
        const resultPanel = document.getElementById('resultPanel');
        const statusText = document.getElementById('statusText');
        const errorText = document.getElementById('errorText');

        function displayResults(analysis) {
            // Score Section
            const scoreSection = document.getElementById('scoreSection');
            const score = analysis.resume_score || 0;
            let scoreEmoji = '📝';
            let scoreMessage = 'Needs Improvement';
            
            if (score >= 80) {
                scoreEmoji = '✨';
                scoreMessage = 'Excellent Resume!';
            } else if (score >= 60) {
                scoreEmoji = '👍';
                scoreMessage = 'Good Resume';
            }
            
            scoreSection.innerHTML = `
                <div class="score-label">Overall Resume Score</div>
                <div class="score-value">${score}/100</div>
                <div class="score-slider-container">
                    <div class="score-range-bar">
                        <div class="score-range-fill" style="width: ${score}%"></div>
                    </div>
                    <div class="score-labels">
                        <span>0</span>
                        <span>50</span>
                        <span>100</span>
                    </div>
                </div>
                <div class="score-emoji">${scoreEmoji}</div>
                <div class="score-label">${scoreMessage}</div>
            `;
            
            // Gap Checklist Section
            const gapSection = document.getElementById('gapSection');
            if (analysis.gap_checklist) {
                let gapHTML = `
                    <div class="section">
                        <div class="section-header">
                            <span class="section-icon">📋</span>
                            <div>
                                <h2 class="section-title">Gap Checklist</h2>
                                <p class="section-subtitle">Check if your resume contains all essential components</p>
                            </div>
                        </div>
                        <div class="checklist-grid">
                `;
                for (const [key, value] of Object.entries(analysis.gap_checklist)) {
                    const status = value ? 'has' : 'missing';
                    const icon = value ? '✅' : '❌';
                    gapHTML += `
                        <div class="checklist-item ${status}">
                            <span class="checklist-icon">${icon}</span>
                            <span class="checklist-label">${key}</span>
                        </div>
                    `;
                }
                gapHTML += `
                        </div>
                    </div>
                `;
                gapSection.innerHTML = gapHTML;
            }
            
            // Technical Skills Section
            const skillsSection = document.getElementById('skillsSection');
            if (analysis.technical_skills && analysis.technical_skills.length > 0) {
                let skillsHTML = `
                    <div class="section">
                        <div class="section-header">
                            <span class="section-icon">🛠️</span>
                            <div>
                                <h2 class="section-title">Technical Skills</h2>
                                <p class="section-subtitle">Skills detected in your resume (${analysis.technical_skills.length} total)</p>
                            </div>
                        </div>
                        <div class="skills-container">
                `;
                analysis.technical_skills.forEach(skill => {
                    skillsHTML += `<span class="skill-tag">${skill}</span>`;
                });
                skillsHTML += `
                        </div>
                    </div>
                `;
                skillsSection.innerHTML = skillsHTML;
            }
            
            // Improvements Section
            const improvementsSection = document.getElementById('improvementsSection');
            if (analysis.improvements && analysis.improvements.length > 0) {
                let improvementsHTML = `
                    <div class="section">
                        <div class="section-header">
                            <span class="section-icon">💡</span>
                            <div>
                                <h2 class="section-title">Improvement Suggestions</h2>
                                <p class="section-subtitle">Recommendations to strengthen your resume (${analysis.improvements.length} suggestions)</p>
                            </div>
                        </div>
                        <ul class="improvements-list">
                `;
                analysis.improvements.forEach((improvement, index) => {
                    improvementsHTML += `<li class="improvement-item"><strong>Tip ${index + 1}:</strong> ${improvement}</li>`;
                });
                improvementsHTML += `
                        </ul>
                    </div>
                `;
                improvementsSection.innerHTML = improvementsHTML;
            }
        }

        analyzeBtn.addEventListener('click', async () => {
            errorText.textContent = '';
            resultPanel.classList.add('hidden');
            statusText.textContent = 'Sending resume for analysis...';
            
            const progressContainer = document.getElementById('progressContainer');
            progressContainer.classList.add('active');

            const file = resumeFile.files[0];
            if (!file) {
                errorText.textContent = 'Please select a PDF resume file first.';
                progressContainer.classList.remove('active');
                return;
            }

            const formData = new FormData();
            formData.append('resume', file);

            analyzeBtn.disabled = true;
            analyzeBtn.textContent = 'Analyzing...';

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData,
                });

                const result = await response.json();
                if (!response.ok) {
                    errorText.textContent = result.error || 'Analysis failed. Please try again.';
                } else {
                    resultPanel.classList.remove('hidden');
                    statusText.textContent = 'Resume analysis delivered successfully.';
                    displayResults(result.analysis);
                }
            } catch (error) {
                errorText.textContent = 'Unable to contact the server. Please try again later.';
            } finally {
                progressContainer.classList.remove('active');
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = 'Analyze Resume';
            }
        });
    </script>
</body>
</html>
